# ✅ Either remove 'name:' or use a valid format
name: socialapp-lamasocial  # Lowercase, no spaces

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend:/api
      - /app/node_modules
    networks:
      - socialApp
    ports:
      - "5000:5000"

  frontend:
    build: 
      context: ./frontend/client
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./frontend/client:/app
      - /app/node_modules
    networks:
      - socialApp
    ports:
      - "3000:3000"
    depends_on:
      - backend

networks:
  socialApp:
    driver: bridge